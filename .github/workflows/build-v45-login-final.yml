name: Build v45 Login Final

on:
  push:
    paths:
      - 'build/v45_login_exact_patch.py'
      - 'build/v45_runtime_fix.py'
      - '.github/workflows/build-v45-login-final.yml'
  workflow_dispatch:

jobs:
  build-v45:
    runs-on: windows-2022
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact approved v43 base
        shell: pwsh
        run: |
          $base = 'b2be2f045b887e2ee1f1ea4555daab7c688748b1'
          New-Item -ItemType Directory -Force -Path _approved | Out-Null
          $chunks = @()
          foreach ($i in 0..4) {
            $name = ('build/payload.part.{0:D2}' -f $i)
            $chunks += (git show "$base`:$name")
          }
          $b64 = ($chunks -join '')
          [IO.File]::WriteAllBytes('project.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path project.zip -DestinationPath project -Force
          git show "$base`:build/v41_patch.py" | Set-Content _approved/v41_patch.py -Encoding utf8NoBOM
          git show "$base`:build/v42_patch.py" | Set-Content _approved/v42_patch.py -Encoding utf8NoBOM
          git show "$base`:build/v43_patch.py" | Set-Content _approved/v43_patch.py -Encoding utf8NoBOM

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller pillow

      - name: Apply approved v41-v43 and prepare exact logo asset
        working-directory: project
        shell: pwsh
        run: |
          python ..\_approved\v41_patch.py
          python ..\_approved\v42_patch.py
          python ..\_approved\v43_patch.py
          python ..\build\v45_login_exact_patch.py
          Write-Host "Asset preparation exit code: $LASTEXITCODE"
          python ..\build\v45_runtime_fix.py

      - name: Validate final login source
        working-directory: project
        shell: pwsh
        run: |
          python -m py_compile src\controle_contas\app.py
          python -c "from pathlib import Path; t=Path('src/controle_contas/app.py').read_text(encoding='utf-8'); s=t[t.index('    def show_login(self):'):t.index('    def login(self):')]; assert 'seu Login' not in s; assert \"Image.open(resource('data/cc_logo_user.png'))\" in s; assert 'draw_cc_logo(img, W, H)' not in s; assert 'paste_cc_logo(img, W, H)' not in s; assert Path('data/cc_logo_user.png').stat().st_size > 10000; print('LOGIN RUNTIME VALIDATED')"

      - name: Run tests
        working-directory: project
        shell: pwsh
        run: pytest -q

      - name: Build executable
        working-directory: project
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Controle de Contas v45" --icon "data/cc_logo.ico" --paths src --add-data "data;data" main.py

      - name: Validate executable
        working-directory: project
        shell: pwsh
        run: |
          $exe = 'dist\Controle de Contas v45.exe'
          if (!(Test-Path $exe)) { throw 'Executavel nao gerado' }
          $size = (Get-Item $exe).Length
          Write-Host "EXE_SIZE=$size"
          if ($size -lt 90000000) { throw "Executavel incompleto: $size bytes" }
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Contas-v45-login-final
          path: project/dist/Controle de Contas v45.exe
          if-no-files-found: error
