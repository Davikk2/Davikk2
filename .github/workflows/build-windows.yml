name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem build\payload.part.* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('project.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path project.zip -DestinationPath project -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller pillow

      - name: Improve CC logo and Windows icon
        shell: pwsh
        working-directory: project
        run: |
          $code = @'
          from pathlib import Path
          from PIL import Image, ImageDraw

          data = Path('data')
          data.mkdir(exist_ok=True)
          S = 1024
          scale = 4
          hi = Image.new('RGBA', (S*scale, S*scale), (0, 0, 0, 0))
          d = ImageDraw.Draw(hi)
          cx1, cx2, cy = 360*scale, 650*scale, 510*scale
          r, stroke = 285*scale, 122*scale
          box1 = (cx1-r, cy-r, cx1+r, cy+r)
          box2 = (cx2-r, cy-r, cx2+r, cy+r)
          start, end = 42, 318

          def lerp(a, b, t):
              return tuple(round(a[i]*(1-t)+b[i]*t) for i in range(3))

          steps = 420
          for i in range(steps):
              t = i/(steps-1)
              a0 = start + (end-start)*i/steps
              a1 = start + (end-start)*(i+1)/steps + 0.35
              left = lerp((11, 108, 126), (30, 145, 157), t)
              right = lerp((61, 173, 173), (88, 197, 190), t)
              d.arc(box1, a0, a1, fill=left+(255,), width=stroke)
              d.arc(box2, a0, a1, fill=right+(255,), width=stroke)

          mask1 = Image.new('L', hi.size, 0)
          mask2 = Image.new('L', hi.size, 0)
          ImageDraw.Draw(mask1).arc(box1, start, end, fill=255, width=stroke)
          ImageDraw.Draw(mask2).arc(box2, start, end, fill=255, width=stroke)
          import PIL.ImageChops as IC
          overlap = IC.multiply(mask1, mask2)
          dark = Image.new('RGBA', hi.size, (41, 59, 72, 218))
          hi.alpha_composite(Image.composite(dark, Image.new('RGBA', hi.size, (0,0,0,0)), overlap))

          img = hi.resize((S, S), Image.Resampling.LANCZOS)
          bbox = img.getbbox()
          if bbox:
              img = img.crop(bbox)
          pad = 60
          square = Image.new('RGBA', (max(img.width, img.height)+pad*2, max(img.width, img.height)+pad*2), (0,0,0,0))
          x = (square.width-img.width)//2
          y = (square.height-img.height)//2
          square.alpha_composite(img, (x, y))
          square.save(data/'cc_logo.png')
          square.save(data/'cc_logo.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])

          app = Path('src/controle_contas/app.py')
          text = app.read_text(encoding='utf-8')
          marker = "super().__init__(); self.title('Controle de Contas');self.geometry('1440x860');self.minsize(1180,720);self.configure(bg=BG)"
          if marker in text and "cc_logo.ico" not in text:
              replacement = marker + "\n        try:\n            ico = resource('data/cc_logo.ico')\n            png = resource('data/cc_logo.png')\n            if ico.exists(): self.iconbitmap(default=str(ico))\n            if png.exists():\n                self._window_icon = tk.PhotoImage(file=str(png))\n                self.iconphoto(True, self._window_icon)\n        except Exception:\n            pass"
              text = text.replace(marker, replacement, 1)
              app.write_text(text, encoding='utf-8')
          '@
          $code | python -

      - name: Make login background uniform
        shell: pwsh
        working-directory: project
        run: |
          $code = @'
          from pathlib import Path
          p = Path('src/controle_contas/app.py')
          text = p.read_text(encoding='utf-8')

          old = '''            img=Image.new('RGBA',(W,H),(6,11,20,255))
            d=ImageDraw.Draw(img)

            top=(5,9,18,255); bottom=(7,13,24,255)
            for y in range(H):
                t=y/max(1,H-1)
                c=tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(4))
                d.line((0,y,W,y), fill=c)

            overlay=Image.new('RGBA',(W,H),(0,0,0,0))
            od=ImageDraw.Draw(overlay)
            fade_start=int(W*0.38)
            solid_start=int(W*0.57)
            solid=(5,8,15)
            for x in range(fade_start, solid_start):
                t=(x-fade_start)/max(1, solid_start-fade_start)
                od.line((x,0,x,H), fill=(*solid, int(255*t)))
            od.rectangle((solid_start,0,W,H), fill=(*solid,255))
            img=Image.alpha_composite(img, overlay)
'''
          new = '''            img=Image.new('RGBA',(W,H),(5,10,18,255))
'''
          if old in text:
              text = text.replace(old, new, 1)

          old_icons = '''            doc_icon(W*0.08,H*0.18,32*scale,18)
            doc_icon(W*0.50,H*0.23,26*scale,14)
            doc_icon(W*0.56,H*0.74,22*scale,12)
'''
          new_icons = '''            doc_icon(W*0.08,H*0.17,30*scale,16)
            doc_icon(W*0.18,H*0.42,22*scale,10)
            doc_icon(W*0.30,H*0.70,20*scale,9)
            doc_icon(W*0.50,H*0.23,24*scale,12)
            doc_icon(W*0.60,H*0.52,18*scale,9)
            doc_icon(W*0.56,H*0.74,20*scale,10)
            doc_icon(W*0.82,H*0.22,22*scale,10)
            doc_icon(W*0.86,H*0.70,18*scale,8)
'''
          if old_icons in text:
              text = text.replace(old_icons, new_icons, 1)

          p.write_text(text, encoding='utf-8')
          '@
          $code | python -

      - name: Run tests
        shell: pwsh
        working-directory: project
        run: |
          $env:PYTHONPATH = "src"
          pytest -q

      - name: Build executable
        shell: pwsh
        working-directory: project
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Controle de Contas v41" --icon "data/cc_logo.ico" --paths src --add-data "data;data" main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Contas-v41
          path: project/dist/Controle de Contas v41.exe
          if-no-files-found: error
